# Hosts the source registry is allowed to name.
#
# `scripts/check_registry.py` refuses any `url` or `fetch_url` in
# `sources.toml` whose host is not listed here. The point is not that these
# hosts are trustworthy: it is that adding a new one is a deliberate act by a
# person, recorded in a commit.
#
# The unattended agents cannot extend this list. `scripts/` is mounted
# read-only for the agent phase (see docs/design/agent-sandbox.md), so an
# injected intake run cannot register a source pointing at a host of its
# choosing, and therefore cannot turn the 30-minute poll into a beacon.
#
# Baseline generated from the 308 sources registered on 6 Aug 2026 and
# reviewed by hand. Adding a host here is normal maintenance; do it in the
# same commit as the source that needs it, and say why in the message.

[hosts]

# Community platforms the discovery lanes feed. These are also bound to an id
# prefix in check_registry.py: a `reddit-*` source may only name reddit.com,
# and so on, so a poisoned candidate cannot register itself as a Reddit thread
# that fetches from somewhere else.
community = [
  "bitcointalk.org",
  "stacker.news",
  "www.reddit.com",
]

# Social and nostr blocks ([[x_post]], [[nostr_post]]).
social = [
  "njump.me",
  "x.com",
]

# The vendor, its firmware and its published record.
vendor = [
  "blog.coinkite.com",
  "coinkite.com",
  "coldcard.com",
  "store.coinkite.com",
]

# Code, repositories and package indexes.
code = [
  "gist.github.com",
  "github.com",
  "raw.githubusercontent.com",
]

# Chain monitors and incident trackers.
trackers = [
  "cktripwire.com",
  "coldcard-hack-tracker.vercel.app",
  "coldcard.rip",
  "coldcardwatch.com",
]

# Other vendors, wallet projects and their responses.
