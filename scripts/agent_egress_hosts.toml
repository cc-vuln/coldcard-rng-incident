# Historical mirror of hosts admitted through vet_host.py.
#
# Since 9 August 2026 scripts/agent_proxy.py does NOT read this file or
# registry_hosts.toml. Agents receive held evidence from the driver and may
# reach only provider endpoints named in the gitignored
# agent-egress.local.toml. The uid firewall permits only that local proxy and
# does not permit direct DNS. This file stays additive for audit continuity
# while vet_host.py admits source hosts; its contents do not grant access.
#
# A leading dot means the domain and its subdomains: ".example.com" matches
# api.example.com and counterexample.com does not. Bare names match exactly.
#
# Evidence acquisition, including the claim sweep, is driver-side. A missing
# held capture is reported as a coverage gap rather than fetched by an agent.

# WHICH MODEL PROVIDER THIS PROJECT USES IS NOT IN THIS FILE, and must not be
# added to it. Its API hostnames live in `agent-egress.local.toml` beside this
# one, which is gitignored, for the same reason `REVIEW_AGENT_BIN` lives in
# `.env` and the capture host's address lives in `AGENTS.local.md`: an archive
# whose own agents read attacker-adjacent material should not publish which
# models and CLIs those agents are, or a reader of this repository has a
# specification for attacking them.
#
# A missing local provider file is reported at proxy startup rather than
# assumed away, because an allowlist that silently lost the provider looks
# exactly like an outage.
#
# See `agent-egress.local.toml.example` for the shape.

[hosts]

# Provider telemetry is deliberately NOT listed, and the refusals in the proxy
# log are the intended outcome rather than a gap to close. An agent here is
# reading victim accounts, attribution disputes and community threads, and a
# crash reporter is a channel for fragments of that to leave the host to a
# party with no relationship to this archive.
#
# Measured on 6 Aug 2026: all three providers complete a full intake run with
# their telemetry endpoints refused (one attempts a third-party log intake,
# and the run succeeds anyway). If a future provider genuinely will not work without it,
# that is a fact worth knowing before choosing that provider, which is another
# reason to leave the refusal visible instead of quietly allowing it.

# Public code and package indexes the sweep reads when checking whether a
# reported reproduction, patch or script has been published.
code_search = [
  "api.github.com",
  "objects.githubusercontent.com",
]

# Admitted by scripts/vet_host.py alongside registry_hosts.toml, so
# the proxy's two allowlist files record the same admissions.
admitted = [
  "chainabuse.com",
  "lu.ke",
  "orange.surf",
  "support.ledger.com",
  "thehackernews.com",
  "www.bleepingcomputer.com",
  "www.citadel21.com",
  "www.ledger.com",
  "www.web3isgoinggreat.com",
]
