why = """
Jeff Swanson answers those calling the incident an obituary for self-custody
with the opposite reading: a five-year-old entropy bug was exploited, roughly
$90 million was stolen, all of it visible on-chain and auditable in real time,
the network identified it within hours and a fix shipped within days, whereas a
bank breach is buried, lawyered and ultimately socialised through inflation. He
argues the exploit exposed a flaw in one specific product rather than in
self-custody. Held partly for the $90 million figure, which sits below other
totals held here, including Galaxy's relayed estimate of 2,055 BTC or about $130
million and Ben Hart's same-day $130 million; this record shows the range and
what each figure assumes rather than picking one. The figure and the
antifragility argument are the poster's own and are not verified here.
"""
