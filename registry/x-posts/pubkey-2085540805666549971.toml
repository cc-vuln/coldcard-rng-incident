why = """
PubKey asks people to donate their dead Coldcard so the bar can construct a
memorial, "so we never forget this horrific event", opening with "We believe
that we will win. But we win on the shoulders of those who came before us."
PubKey is a commercial bitcoin bar in New York and the request is for physical
devices. Held as a dated artefact of how the incident was being memorialised
within about a week of disclosure. It sits against guidance held elsewhere in
this record that owners should not destroy or part with an affected device,
because any future recovery claim may depend on proving ownership with it; the
archive holds both and recommends neither.
"""
