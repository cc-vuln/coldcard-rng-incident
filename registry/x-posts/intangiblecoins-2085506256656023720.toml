Alex Thorn notes that many bitcoiners are giving up work and family time to deal
with the fallout, and thanks Bloomberg for covering two of those stories,
attaching screenshots of the article. The captured screenshots show a 6 August
2026 piece by Ben Weiss quoting Thorn saying the victims are average everyday
people saving their money in bitcoin, that he has been immersed in victim reports
and code, and that he told victims who lost all their savings and felt ashamed
that he would help as much as he could; Robert Hamilton of AnchorWatch describing
sleepless nights and teaming up with other developers to use AI to find security
vulnerabilities; and Becca Rubenfeld saying it is as if they are off at war.
Held as a dated marker of the incident reaching mainstream financial press and of
which responders that press went to. Thorn heads research at Galaxy, whose
flow-of-funds accounting the archive holds at glxyresearch-flow-map, and Hamilton
is AnchorWatch's chief executive, both interests recorded elsewhere in the
register. The article's contents are Bloomberg's reporting and the quotations are
its subjects' own; nothing in it is verified here, and the article itself is not
held by this archive.
