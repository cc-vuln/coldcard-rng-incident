Galaxy Research advises single-sig COLDCARD users to migrate funds to a fresh
seed not generated by the COLDCARD, warns that remaining vulnerable addresses
will eventually be drained, and states that multisig and collaborative custody
setups where COLDCARD alone cannot reach threshold are safe but should still
rotate keys. Held as a reported incident-response recommendation from the
primary tracking team.
