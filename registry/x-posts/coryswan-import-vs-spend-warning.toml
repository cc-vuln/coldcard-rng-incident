title = "Importing versus spending to a new wallet"
url = "https://x.com/CorySwan/status/2083248545960698115"
author = "CorySwan"
posted = "2026-07-31T17:48:52Z"
why = """
Cory Klippsten warns that importing a COLDCARD-generated seed into a different hardware wallet, rather than spending the bitcoin to a newly generated seed, leaves the funds vulnerable because the seed entropy is low. He notes that some users may choose import to save fees or after loss or theft of the COLDCARD, and stresses that a fresh seed should be generated on the new device. Held as dated migration guidance from a Swan employee during the early incident response. The guidance is the poster's own and is not independently verified here.
"""
