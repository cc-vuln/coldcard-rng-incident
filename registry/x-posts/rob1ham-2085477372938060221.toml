title = "Security policy coverage across scanned projects"
url = "https://x.com/Rob1Ham/status/2085477372938060221"
author = "Rob1Ham"
posted = "2026-08-06T21:25:26Z"
why = """
Rob Hamilton urges projects that touch people's money to publish a SECURITY.md,
quoting calle's post that outreach is the campaign's biggest bottleneck. The
quoted card carries the measurement behind the plea, taken over 426 reviewed
projects: 19.5 per cent publish a SECURITY.md, 13.1 per cent expose an
extractable security email, 28 route through GitHub advisories or a bug bounty
with no email, and 342 have no published policy at all. That figure for how
reachable bitcoin projects are for disclosure is the reason to hold this rather
than the exhortation, and it is one of the few Red Team outputs stated as a
proportion rather than a count of findings. Hamilton co-leads the campaign that
produced the numbers and the underlying dataset is not published. The figures are
the campaign's own and are not checked here.
"""
