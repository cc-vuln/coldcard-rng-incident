why = """
The vendor's own notice, in full, that it has temporarily suspended the
automated blanking of customer records because of legal obligations to preserve
material relevant to ongoing and anticipated proceedings. It states that standard
practice is to blank records after 120 days, keeping only email address and
country of residence, that accelerated blanking has been available on request,
that retained data will be access-restricted and used only for compliance, and
that customers who do not want their data preserved must say so by writing to the
support address, which inverts the usual default. A primary vendor artefact and
the clearest signal in this record that litigation is anticipated. The blog
version is held at coinkite-data-retention-update, and the earlier and much
shorter reply on the same subject is at coldcardwallet-2084574110445674733; the
120-day figure here sits against the 90-day understanding reported by owners at
reddit-coinkite-email-data-retention and questioned by a competing vendor at
satochip-data-retention-question. The capture shows the post as edited after
publication. The vendor's description of its own obligations and practices is its
own account and is not verified here.
"""
