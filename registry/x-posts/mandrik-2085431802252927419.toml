General advice, posted during the incident, that the best hardware wallet is
the one the owner knows intimately: buy several brands, use them extensively,
practise sending, receiving, backing up and restoring, and only then move
serious funds. It makes no claim about the COLDCARD defect and cites no
incident material. Held as a sample of the guidance circulating in the week,
though it is closer to general self-custody advice than to incident material
and whether it belongs is a question for a person. The recommendation is the
