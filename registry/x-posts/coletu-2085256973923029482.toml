Cole reports the result of his own live experiment fourteen hours in: of five
wallets funded on a compromised COLDCARD Mk3, only the plain seed-phrase wallet
had been emptied, and the four protected by a passphrase or a non-standard
account number still held funds. The post quotes his earlier video setting the
test up and attaches a block-explorer view of the funding transaction, one
0.00055 BTC input split into five outputs of 0.000108 BTC. A first-hand, dated
observation of which configurations the sweeper actually reached, which bears on
the passphrase question other held sources argue about. It is one device, one
attempt and a fourteen-hour window rather than a general result, and the video
itself is not captured by this tool. The setup and the conclusion drawn from it
are the poster's own and are not reproduced here.
