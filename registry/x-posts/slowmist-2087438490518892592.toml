[[x_post]]
id = "slowmist-2087438490518892592"
title = "SlowMist reproduction of the COLDCARD private-key vulnerability"
url = "https://x.com/slowmist_team/status/2087438490518892592"
author = "SlowMist_Team"
posted = "2026-08-12T07:18:13Z"
why = """
SlowMist Security Team reports reproducing the COLDCARD attack chain using Mk3
firmware 4.1.9 and estimates at least 1,719 BTC (~$111M) lost across more than
5,200 addresses. The post traces the attack to a build configuration that
disabled the STM32 hardware TRNG, leaving a predictable Yasmarang software PRNG
with effective entropy of roughly 40 bits on Mk2/Mk3 and 72 bits on Mk4/Mk5/Q.
The figures and reproduction are SlowMist's own and are not independently
verified here.
"""
