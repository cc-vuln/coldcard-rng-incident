why = """
The BTCPay Server account thanks the Bitcoin Red Team for a responsible
security disclosure and gives concrete post-update steps: refresh macaroons
and macaroons.db, refresh auth strings for other LN backends, and move funds
from any hot on-chain BTCPay wallet before recreating it. Held as an
organisational incident-response statement about a vulnerability disclosed
during the Coldcard-response week. The disclosure details and remediation
steps are the poster's own and are not verified here.
