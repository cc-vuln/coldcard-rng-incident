why = """
A thought experiment: taking the affected generator's range as roughly 1.1
trillion outcomes, or 40 bits, the poster computes the odds that a dice-rolled
seed nonetheless lands inside that range as a figure with more than seventy
leading zeros, and sets it beside the odds of being struck by lightning and of
winning a lottery. He concludes that people are misframing the difference
between breaking a small range of outcomes and breaking single-sig, and tells
readers to roll the dice and record the results themselves. Held as a distinct
argument in the dice debate; note that the objection raised elsewhere in the
record, at notgrubles-2085481084888760400, is about firmware discarding dice
input rather than about coincidental overlap, so the two are answering different
questions. Held sources put the Mk3 figure variously at about 23, 32 and 40
bits. The arithmetic, the framing and the advice are the poster's own and are not
verified here.
"""
