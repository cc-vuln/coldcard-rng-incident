why = """
Checkonchain reports that the incident cut Long-Term Holder supply by about
233,000 BTC, a 1.38% fall from its recent all-time high, and asks whether the
emergency migration of coins has skewed the on-chain metrics analysts use to
read Bitcoin. It points to a newsletter piece by @_Checkmatey_ documenting the
size and scale of the change across network activity and on-chain supply
structure and assessing its effect on several key metrics; a chart is attached
and the linked piece is not currently held in this archive. Held because it is
one of the few attempts in the record to measure the incident's effect on the
wider chain rather than to count losses, and because a mass migration that resets
coin ages is a measurement problem for anyone reading on-chain data from this
period. Checkonchain is an analytics business and the post promotes its own
newsletter; the figures and the method behind them are theirs and are not
verified here.
"""
