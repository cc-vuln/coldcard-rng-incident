why = """
Eric Yakes predicts that the COLDCARD incident will not be remembered as a
significant moment in bitcoin history and that what will be remembered is
bitcoin developers running their own equivalent of Project Glasswing in public,
on open-source models, without a frontier lab's resources and funded publicly.
He closes by directing donations to the Red Team through OpenSats. Held as a
compact statement of the position that the response matters more than the breach,
which several held sources take, and as a further instance of the incident being
converted into a fundraising ask. It is a prediction and a solicitation, not a
claim of fact about the defect. The judgement is the poster's own.
"""
