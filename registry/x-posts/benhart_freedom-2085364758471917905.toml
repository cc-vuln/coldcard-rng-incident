asserts that the top bitcoin influencers who called Coldcard the gold standard
were paid by Coinkite to hype it. Held because it is a rare, fully worked
first-hand statement of the conclusion the incident produced in an ordinary
holder: that trustlessness is not available in practice and that he would rather
trust Fidelity, Apple or a large bank than a small wallet company. The mechanism
description, the loss and headcount figures and the paid-influencer assertion
are his own and are not verified here, and the technical accounts held elsewhere
in this record describe the failure differently.
