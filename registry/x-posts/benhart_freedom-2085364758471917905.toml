A long first-person account from a 68-year-old holder who bought three
COLDCARDs, two Mk4s and a Q, generated his seed with 100 dice rolls and a
dice-generated passphrase, and nonetheless moved everything to Coinbase when he
heard about the incident, and is now considering Fidelity. He gives figures
throughout: more than 2,000 bitcoin, about $130 million, taken by 15 or more
