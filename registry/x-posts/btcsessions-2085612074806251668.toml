title = "Dice-roll verification procedure"
url = "https://x.com/BTCsessions/status/2085612074806251668"
author = "BTCsessions"
posted = "2026-08-07T06:20:42Z"
why = """
Replying to grubles' question about whether firmware could ignore dice input,
BTC Sessions proposes a test to run before rolling a real seed: record a set of
rolls, enter them on the device, then check the same rolls against
iancoleman.io/bip39; if the results match, re-roll and use the offline device for
the seed actually kept. It is the concrete owner-side answer to
notgrubles-2085481084888760400, and it sits alongside the independent dice-path
check at portlandhodl-dice-roll-verification. The method sends the test rolls
into a browser tool, and its safeguard is that those rolls are discarded and
re-rolled afterwards. Whether the check catches every failure mode is not
established by any held source; the procedure is the poster's own and is not
verified here.
"""
