title = "RRWallet mnemonics and the Ill Bloom flaw"
url = "https://x.com/coinspect/status/2085430121670811898"
author = "coinspect"
posted = "2026-08-06T18:17:41Z"
why = """
The security firm Coinspect warns that RRWallet, formerly RenrenBit, generated
seed phrases vulnerable to Ill Bloom in both English and Chinese, says a user who
kept using an affected mnemonic lost $2M recently, and tells anyone who ever used
RRWallet to move funds and never reuse a mnemonic it produced. Ill Bloom is a
separate weak-entropy flaw, described in the record as a twelve-year-old CryptoJS
issue whose public proof of concept is relayed at
threatwire_-2085593099749749082; it is not the COLDCARD defect. Held for the
wider entropy-auditing wave the incident set off and the losses being attributed
to it elsewhere. Interest: Coinspect sells wallet security audits. The affected-
wallet claim and the $2M figure are the firm's own and are not verified here.
"""
