why = """
Stephan Livera setting out why self-custody is hard to teach: the right answer
depends on the amount secured, privacy appetite, tolerance for complexity, the
tradeoff between sovereignty and easy recovery, inheritance plans and whether
services such as loans are needed. He predicts a push to remove single points
of failure in an easier form, closer to what Bitkey and Casa offer, with dice
rolls, multi-vendor multisig and a private Electrum server remaining a smaller
group's path; and argues correctly executed multisig gives fault tolerance,
since a key found to be bad in a 3-of-5 can be rotated out without loss. The
post names two commercial multi-key providers approvingly, which is worth
noting given Livera's position as a bitcoin podcaster and commentator. The
predictions and recommendations are his own.
