more than 7,700 addresses after a firmware vulnerability let seed phrases be
cracked. Held because movement of the consolidated proceeds is the specific event
the archive's chain monitors exist to catch: glxyresearch-attacker-holdings
records the endpoint set as fully unspent on 1 August, and
glxy-law-enforcement-handoff puts 90 percent of the coins unmoved on 3 August, so
a reported spend on 7 August is a change in the funds picture rather than routine
commentary. This is a secondary relay by a commercial media account: the
underlying Lookonchain observation is not held here, the transaction is not
identified in the post, and the 2,055 BTC figure is Galaxy's estimate, which the
loss accounting at /record/funds/ presents alongside the others rather than
adopting. None of it is verified here.
