OrangeSurf advises owners of multisig setups where vulnerable COLDCARD seeds meet the spending threshold not to broadcast migration transactions to the public mempool, to avoid test sends from the multisig, and to use MARA Slipstream for private broadcast. He reports that over 2,500 BTC has been moved from 2/3 multisigs via Slipstream and that he is not yet seeing RBF battles over compromised transactions. Held as dated incident-response guidance during the rescue window. The figures and observations are the poster's own and are not independently verified here.
