A media account's summary of how the Bitcoin Red Team began, quoting Rob
Hamilton's own account, which it also quote-posts: Kimi K3 went to open weights
on 27 July, three days before the disclosure, Hamilton began scanning Bitcoin
infrastructure and found most projects were not using AI for defensive security,
and his replies to calle predate the initiative by a day. The two quoted lines
are that for ten to thirty dollars you can likely scan most small or medium code
bases, and that attackers will do this if they have not already, so defenders'
security posture has to change. Held as a compact dated origin account for the
scanning effort whose figures this record holds throughout. The account and the
cost figure are Hamilton's, relayed by the outlet, and are not verified here.
