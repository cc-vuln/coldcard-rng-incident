why = """
Yan Pritzker reports that he is opening pull requests on widely used wallet
software so that users see a warning about the COLDCARD disclosure inside the
application, and asks other maintainers to do the same, on the reasoning that
many owners are not on X and will not otherwise learn what happened. He links
five: Sparrow 2047, Liana 2242, Electrum 10805, WasabiDoc 2113 and Caravan 524.
Held as the primary announcement of a distinct strand of the response, putting
the notice in front of a person at the moment they reach for the device rather
than in a vendor advisory; the Sparrow change is registered separately as
sparrow-pr-2047, which records that he approved it the same day. Pritzker is at
Swan, a bitcoin brokerage that also sells self-custody products, which is stated
because the wider argument about who benefits from the response is itself part of
the record. Whether each pull request was merged is not established by this post.
"""
