James O'Beirne describing two live cktripwire multisig honeypots: a 2-of-3 with two bad-cc keys whose pubkeys have been revealed by a spend, and a 3-of-3 where all three keys are bad-cc and no pubkey has ever been revealed. He states the experiment's logic explicitly: a sweep of the dark 3-of-3 would show attackers speculatively constructing multisig scripts from pubkeys they have never seen. Primary instrumentation of attacker capability rather than commentary on it. Whether either is swept is a future observation, and the archive records the design, not an outcome.
