note = """
Attribution argument that the pseudonymous GitHub account switck and Peter D.
Gray of Coinkite are one person, resting on a 2020 public exchange read through
the GitHub API and on local GPG verification said to show 58 Switck-authored
commits carrying valid signatures from Gray's personal key. It then traces
commit f19de05, which introduced the STM32 random-number code with the
defective guard, to COLDCARD's seed generation. The gist ships a verify.sh so
the signature checks can be re-run independently, which is why it is registered
as primary work rather than as commentary. Its own text declines to state
intent and calls the guard error an ordinary C mistake. The identity
attribution, the elimination of alternative explanations and every inference
drawn from the commit history are the author's claims, not verified here, and
registration is not endorsement of them. This gist is the underlying artefact
for the allegation preserved at reddit-switck-identity-claims. The publishing
account is recorded as published; this archive does not assert who is behind
it. Six revisions within 80 minutes of creation, so it is watched.
"""
