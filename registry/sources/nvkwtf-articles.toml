# registry-order: 289

# ------------------------------------------------- third-party aggregators

[[source]]
id = "nvkwtf-articles"
title = "nvk.wtf articles index"
url = "https://nvk.wtf/articles"
org = "nvk.wtf"
kind = "aggregator"
tier = 3
capture = "browser"
min_chars = 500
required_text = ["Reporting and research on the Coldcard vulnerability", "Newest first"]
note = """
Index of third-party reporting and research on the incident, each entry linked
out to its source. The site is an aggregator run alongside promotion of
competing open-source hardware (SeedSigner, BTClock, Passport) and takes an
openly critical stance toward NVK and Coinkite, so its selection and summaries
are editorial and interested; the operator is not named on the site. Tracked
for what it chooses to include and when, and as a discovery feed: anything it
surfaces is followed to the primary and registered there, never cited from
this copy. SPA with no feed or API; every path serves the app shell, so
capture goes through the browser.
"""
