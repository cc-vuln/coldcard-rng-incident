note = """
Published five weeks before this incident, about a physical-mail campaign using
a post-quantum firmware-upgrade pretext. States that Coinkite would never send a
paper letter, that the mail is a scam, and that customer physical addresses are
deleted after 120 days, which Coinkite attributes the targeting data to leaks
elsewhere rather than a breach of its own. Held for two reasons: it establishes
an impersonation playbook that predates the entropy disclosure and could be
recycled against it, and it shows the vendor publishing exactly the kind of scam
guidance that has not accompanied the entropy advisory.
