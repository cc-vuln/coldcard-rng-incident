note = """
Jameson Lopp's 6 August essay for Casa, and two things at once: a restatement
of the incident for a general reader, and Casa's account of its own security
practice. It argues that the economics of finding a vulnerability have inverted
now that a frontier model can read a large codebase cheaply, that a
point-in-time audit is "a photograph, not a film", and that the defect survived
review because it sat in build glue rather than in the cryptographic library
everyone scrutinised. It then describes what Casa says it does: regular
full-scope external penetration tests, targeted audits before launch,
event-driven re-engagement, and an AI penetration-testing harness run against
its own code. Casa is a custody provider with a commercial interest in the
comparison it draws, and its account of its own internal practice is not
observable from this archive. Its statement that researchers believe the
vulnerability was most likely found by a frontier model is an attribution the
record holds as contested; see the AI discovery material.
"""
