note = """
A Stacker News thread collecting screenshots said to show COLDCARD owners
reporting unexplained drains from 2022 onward, and asking what a vendor could
have done about a defect of this kind without signalling it to attackers. The
underlying claim is unverified here: the screenshots are reproduced from
elsewhere, the thread links an X thread as its source, and this project has
not established the provenance or dates of the original reports. Registered
because a claim of much earlier losses would change the incident's scope if it
held up, and because the discussion itself is part of the response record.

Captured through the site's public GraphQL API since 4 Aug 2026: the browser
route began crashing the capture tab sitewide, and the API answers POST from
this host while the rendered page is challenge-gated. The query fixes the
captured surface to the item's title, text and two levels of comments, each
with author and absolute timestamp.
"""
