note = """
OpenSats' own 6 August announcement, by Gigi and the organisation, that red
team applications will be prioritised for the foreseeable future, with a
dedicated path at opensats.org/red and reimbursement of past LLM token costs.
Held as a funder changing what it pays for in response to the incident, which
is a distinct kind of response from a statement about it: the same nonprofit is
named in the held Red Team posts as covering their compute bill. OpenSats is a
bitcoin funding nonprofit and NVK stepped down from its board on 2 August
(opensats-nvk-board-departure); the post itself draws no connection. What is
disbursed under the policy is not observable from this archive.
