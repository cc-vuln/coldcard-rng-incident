Scoresby relays Galaxy Research's 14 August update on the Coldcard investigation: 190 victim contacts, 1,778.84 BTC ($112.7m) stolen from more than 8,600 addresses, and a possible total of 2,417.35 BTC ($153m) if unconfirmed Wave 4 thefts are included. The thread also notes that most stolen funds have remained unmoved, some movement through Coinjoin and peelchains, elevated small-exchange inflows after the incident, and BlackRock lowering the IBIT in-kind creation minimum. Held as a dated update to Galaxy's loss accounting. The figures are Galaxy's and are not independently verified here.
