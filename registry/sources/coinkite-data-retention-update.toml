note = """
The vendor's own post on a temporary change to its customer-data retention and
blanking practices after the incident. Registered 7 August 2026 because the
record already held the 2 August outreach exchange — Coinkite saying customer
personal data is deleted and many customers were therefore unreachable
(coldcard-pii-policy), Satochip asking how store customers received emails
under a 90-day premise (satochip-data-retention-question), and the June paper
spam post's 120-day figure — with no primary statement reconciling them. The
blog index (coinkite-blog-index) carried this post on 7 August; its displayed
date moved from Aug 6 to Aug 7 between two captures of that index, so the
publisher retimestamped it and the published date above is the one currently
shown rather than a resolved publication time.

At first capture the post states that Coinkite's standard practice is to blank
customer records automatically after 120 days, retaining only email address and
country of residence, with accelerated blanking available on request; that the
automated blanking process is temporarily suspended because of legal
obligations arising from the incident, including preservation of records that
may be relevant to "ongoing and anticipated legal proceedings"; and that a
customer may ask to be exempted from the preservation and have the standard
policy applied. It is the vendor's own account of its retention practice and of
why it changed, not an independently checkable fact about what is stored.
"""
