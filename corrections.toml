The section no longer states a count. It says what kind of material is held and
which artefacts are reproduced here rather than described, and the page now
carries the phishing-email reports, the baited repository and the impersonation
accounts it had left out.
"""
why = """
Found on 7 August 2026 while bringing the page up to date. A count of this
project's own holdings is a claim in this project's voice, and it was wrong
when published on 5 August: reddit-phishing-advisory-email,
americanhodl-desktop-app-phishing, bitcoinrothbard-trezor-phishing and
