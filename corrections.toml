[[correction]]
date = "2026-08-07"
pages = ["/how-it-broke/entropy/", "/"]
kind = "clarification"
summary = """
Two pages said no confirmed drain of an Mk4-class wallet had been captured,
without saying they meant this incident's July 2026 waves. One held source
describes an earlier confirmed Mk4 theft whose cause is unproven.
"""
said = """
As of 4 August 2026, no captured source in this archive demonstrated a
confirmed drain of a wallet generated on one of those models.
"""
says = """
The claim is now bounded to this incident's July 2026 waves, on both pages, and
the entropy page records the earlier case beside it: ChuckSRQ's 4 August
catalogue of pre-July drain reports lists a July 2023 theft of 3.73118785 BTC
from an Mk4 owner who described a device-generated seed, with the theft and
amount cited to a transaction and the author stating plainly that its exact
cause is not proven.
"""
why = """
Found on 7 August 2026 while rechecking the candidate-space pages. Both
statements were defensible against their own evidence markers, which said "in
this incident", and the entropy page carried a 4 August bound while the
ChuckSRQ capture is dated 5 August. Neither reads that way on the page: a
sentence saying no Mk4-class drain has been captured, with no incident named,
asserts more than the archive establishes, and the archive held a contradicting
case before the pages were last edited on 6 August. Logged as a clarification
rather than a correction because the graded claim was accurate and the prose
around it was not, which is the distinction this log exists to keep. Nothing
here establishes that the 2023 theft was caused by this defect; the source says
it is the best public candidate and that the cause is unproven, and this project
adds nothing to that.
"""

[[correction]]
date = "2026-08-07"
pages = ["/how-it-broke/"]
kind = "clarification"
summary = """
The page dated two claims about an upstream pull request to 6 August while the
newest capture behind them was from 4 August. The request was merged on
6 August, and the guard it changes was replaced the same day.
"""
said = """
libngu's #ifndef guard is unchanged in the public repository: it still tests
the macro's presence rather than its value ... Pull request #58, which proposes
the value check, remains open as of 6 August 2026.
"""
says = """
Pull request #58 was merged upstream on 6 August 2026 as commit e9d5e80, and
the guard in ngu/random.c now reads #if MICROPY_HW_ENABLE_RNG == 0, so a
zero-valued macro no longer passes it. The page states both merges, #61 on
5 August and #58 on 6 August, and adds what they do not change: these are
commits on the library's public branch, released firmware builds against a
pinned revision, and the board macro is still defined as zero.
"""
why = """
Found on 7 August 2026 while rechecking the technical pages. The page was
committed at 09:25 UTC on 6 August; the merge was captured at 16:26 UTC the
same day, so the sentence was true against the evidence held when it was
written and false by the end of the day it named. That is why this is logged.
The error was not the reading but the bound: the newest capture behind the
claim was from 4 August, and dating it to 6 August asserted a currency the
archive had not checked. A claim of this kind should be dated to the capture
that supports it, not to the day of writing. Established by the held captures
of libngu-pr-58 and libngu-random-c, both at 20260806T162628Z and
20260806T162626Z.
"""
