        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_1147&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:3515,\&quot;name\&quot;:\&quot;QnA\&quot;,\&quot;username\&quot;:\&quot;qna\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/community.foundation.xyz/qna/{size}/284_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2026-07-31T09:08:04.500Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eA serious flaw in Coldcard’s seed generation was disclosed on 30 July, and funds are being stolen as a result. Here is where Passport stands.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eSeeds generated by a Passport are not affected.\\u003c/strong\\u003e Passport Prime and Passport Core both use different code, and neither has ever contained this flaw.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eOne important qualification.\\u003c/strong\\u003e If you imported a seed that was originally created on an affected Coldcard into your Passport, that seed is still affected. Moving a seed to a different device does not repair it, because the problem is in how the seed was created, not where it now lives. The same applies if an affected Coldcard key is one of the keys in a multisig setup. If that describes you, read Coinkite’s advisory below and treat it as urgent.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you own a Coldcard at all, go and read \\u003ca href=\\\&quot;https://blog.coinkite.com/coldcard-mk3-seed-generation-warning/\\\&quot;\\u003eCoinkite’s advisory\\u003c/a\\u003e before anything else. It is time sensitive.\\u003c/p\\u003e\\n\\u003cp\\u003eAnd please read the section on scams at the bottom before you act on anything. A lot of the losses that follow an incident like this come from the scams around it rather than the original problem.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-3515-what-happened-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-3515-what-happened-1\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eWhat happened\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eEvery Bitcoin wallet starts with a seed, and its security depends completely on that seed being unpredictable. If the randomness behind it is weak, everything built on top of it is weak too.\\u003c/p\\u003e\\n\\u003cp\\u003eIn March 2021 Coldcard changed the code behind its seed generation. A check that was meant to guarantee the device’s hardware randomness was being used did not work as intended, and the firmware was instead built to use ordinary software randomness, calculated from predictable values like part of the chip’s fixed identifier and some timing registers. The hardware randomness was still there on the chip. That code path simply stopped using it.\\u003c/p\\u003e\\n\\u003cp\\u003eThe result is that the range of seeds a Coldcard could produce was drastically narrower than it should have been. How much narrower depends on the model and firmware, and how hard the seeds are to recover varies with it, but Coinkite now describes affected seeds as having around 72 bits of protection instead of the expected 128. That is a serious reduction, and it is being actively exploited.\\u003c/p\\u003e\\n\\u003cp\\u003eThe two accounts worth reading:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://blog.coinkite.com/coldcard-mk3-seed-generation-warning/\\\&quot;\\u003eCoinkite’s advisory\\u003c/a\\u003e, the manufacturer’s own, which is being updated as they learn more\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://engineering.block.xyz/blog/predictable-rng-fallback-and-32-bit-reseed-in-coldcard-firmware\\\&quot;\\u003eBlock’s technical analysis\\u003c/a\\u003e, the most thorough public writeup so far\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eCoinkite’s advisory currently covers Mk3 from firmware 4.0.1, Mk4 and Mk5 before 5.6.0, and Q before 1.5.0Q. Block additionally identifies affected Mk2 firmware. Check the advisory directly rather than relying on this summary, since the scope has already widened once.\\u003c/p\\u003e\\n\\u003cp\\u003eTwo things worth understanding if you own one. What matters is the firmware that was running when the seed was created, not when you bought the device, and not which wallet holds it today. And updating your firmware does not fix an existing seed. Recovering from this means generating a new seed and moving your funds to it.\\u003c/p\\u003e\\n\\u003cp\\u003eCoinkite also has guidance on where dice rolls or a strong passphrase change the picture. Read it there rather than taking a rule of thumb from us.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-3515-why-passport-generated-seeds-are-not-affected-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-3515-why-passport-generated-seeds-are-not-affected-2\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eWhy Passport-generated seeds are not affected\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003ePassport does not use the Coldcard code involved in this.\\u003c/p\\u003e\\n\\u003cp\\u003eBoth Passport Core and Passport Prime generate seeds by combining multiple independent hardware sources, including our avalanche noise circuit, a physical component on the board built specifically to produce randomness.\\u003c/p\\u003e\\n\\u003cp\\u003eThe published seed generation code on both devices uses those hardware sources. It does not fall back to a serial number, a device identifier, a timer or a clock.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-3515-checking-rather-than-trusting-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-3515-checking-rather-than-trusting-3\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eChecking rather than trusting\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eYou do not have to take the above on our word, and we would rather you did not.\\u003c/p\\u003e\\n\\u003cp\\u003eOur firmware is open source, so you can read the code that creates your seed yourself. Both devices also have a documented reproducible build process, so you can build a release from source and confirm it matches the binary we published. Passport Core’s is at \\u003ca href=\\\&quot;https://github.com/Foundation-Devices/passport2/blob/main/REPRODUCIBILITY.md\\\&quot;\\u003eREPRODUCIBILITY.md\\u003c/a\\u003e and Passport Prime’s is in the \\u003ca href=\\\&quot;https://github.com/Foundation-Devices/KeyOS\\\&quot;\\u003eKeyOS repository\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eIndependent security audits of both Passport Core and Passport Prime are published in full, along with our responses to them, at \\u003ca href=\\\&quot;https://foundation.xyz/security/\\\&quot;\\u003efoundation.xyz/security\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-3515-please-be-careful-of-scammers-4\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-3515-please-be-careful-of-scammers-4\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003ePlease be careful of scammers\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eThis is the part we would most like you to take away.\\u003c/p\\u003e\\n\\u003cp\\u003eScammers are always circling, but when something high profile happens they go into overdrive, because they know a lot of people are suddenly worried, confused and in a hurry. Assume anyone who contacts you out of the blue about your wallet is a scammer until proven otherwise.\\u003c/p\\u003e\\n\\u003cp\\u003eTo be completely clear about how we operate:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eFoundation will never ask for your seed words, recovery phrase, private keys, passphrase or PIN.\\u003c/strong\\u003e Not by email, not on the forum, not in a support ticket, not on a call. There is no situation in which we need them.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWe will never ask you to type your recovery phrase into a website, a form, an app or a support tool.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWe will never contact you unexpectedly about your wallet, and we will never ask you to move your funds.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWe will never ask you to share your screen or install remote access software.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eIf someone is pressuring you to act quickly, telling you your funds are at risk and they can help, offering a “recovery service”, or asking you to verify your seed somewhere, stop and do nothing. That is the scam.\\u003c/p\\u003e\\n\\u003cp\\u003eBe especially wary of direct messages, of people claiming to be Foundation or Coinkite staff, and of search results and sponsored links for wallet software. Only download software from the official source, and take a moment to check the address you are typing.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you do need to move funds because of this, there is no prize for speed over care. Take your time, verify addresses on your device screen, and if anything feels off, ask here in public rather than in a private message.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\&quot;p-3515-questions-5\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-3515-questions-5\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\\u003e\\u003c/a\\u003e\\u003cstrong\\u003eQuestions\\u003c/strong\\u003e\\u003c/h2\\u003e\\n\\u003cp\\u003eIf you have questions about how your Passport creates and protects your seed, ask below and we will answer them.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;u               <p>A serious flaw in Coldcard’s seed generation was disclosed on 30 July, and funds are being stolen as a result. Here is where Passport stands.</p>
<p><strong>Seeds generated by a Passport are not affected.</strong> Passport Prime and Passport Core both use different code, and neither has ever contained this flaw.</p>
<p><strong>One important qualification.</strong> If you imported a seed that was originally created on an affected Coldcard into your Passport, that seed is still affected. Moving a seed to a different device does not repair it, because the problem is in how the seed was created, not where it now lives. The same applies if an affected Coldcard key is one of the keys in a multisig setup. If that describes you, read Coinkite’s advisory below and treat it as urgent.</p>
<p>If you own a Coldcard at all, go and read <a href="https://blog.coinkite.com/coldcard-mk3-seed-generation-warning/">Coinkite’s advisory</a> before anything else. It is time sensitive.</p>
<p>And please read the section on scams at the bottom before you act on anything. A lot of the losses that follow an incident like this come from the scams around it rather than the original problem.</p>
<h2><a name="p-3515-what-happened-1" class="anchor" href="#p-3515-what-happened-1" aria-label="Heading link"></a><strong>What happened</strong></h2>
<p>Every Bitcoin wallet starts with a seed, and its security depends completely on that seed being unpredictable. If the randomness behind it is weak, everything built on top of it is weak too.</p>
<p>In March 2021 Coldcard changed the code behind its seed generation. A check that was meant to guarantee the device’s hardware randomness was being used did not work as intended, and the firmware was instead built to use ordinary software randomness, calculated from predictable values like part of the chip’s fixed identifier and some timing registers. The hardware randomness was still there on the chip. That code path simply stopped using it.</p>
<p>The result is that the range of seeds a Coldcard could produce was drastically narrower than it should have been. How much narrower depends on the model and firmware, and how hard the seeds are to recover varies with it, but Coinkite now describes affected seeds as having around 72 bits of protection instead of the expected 128. That is a serious reduction, and it is being actively exploited.</p>
<p>The two accounts worth reading:</p>
<ul>
<li>
<p><a href="https://blog.coinkite.com/coldcard-mk3-seed-generation-warning/">Coinkite’s advisory</a>, the manufacturer’s own, which is being updated as they learn more</p>
</li>
<li>
<p><a href="https://engineering.block.xyz/blog/predictable-rng-fallback-and-32-bit-reseed-in-coldcard-firmware">Block’s technical analysis</a>, the most thorough public writeup so far</p>
</li>
</ul>
<p>Coinkite’s advisory currently covers Mk3 from firmware 4.0.1, Mk4 and Mk5 before 5.6.0, and Q before 1.5.0Q. Block additionally identifies affected Mk2 firmware. Check the advisory directly rather than relying on this summary, since the scope has already widened once.</p>
<p>Two things worth understanding if you own one. What matters is the firmware that was running when the seed was created, not when you bought the device, and not which wallet holds it today. And updating your firmware does not fix an existing seed. Recovering from this means generating a new seed and moving your funds to it.</p>
<p>Coinkite also has guidance on where dice rolls or a strong passphrase change the picture. Read it there rather than taking a rule of thumb from us.</p>
<h2><a name="p-3515-why-passport-generated-seeds-are-not-affected-2" class="anchor" href="#p-3515-why-passport-generated-seeds-are-not-affected-2" aria-label="Heading link"></a><strong>Why Passport-generated seeds are not affected</strong></h2>
<p>Passport does not use the Coldcard code involved in this.</p>
<p>Both Passport Core and Passport Prime generate seeds by combining multiple independent hardware sources, including our avalanche noise circuit, a physical component on the board built specifically to produce randomness.</p>
<p>The published seed generation code on both devices uses those hardware sources. It does not fall back to a serial number, a device identifier, a timer or a clock.</p>
<h2><a name="p-3515-checking-rather-than-trusting-3" class="anchor" href="#p-3515-checking-rather-than-trusting-3" aria-label="Heading link"></a><strong>Checking rather than trusting</strong></h2>
<p>You do not have to take the above on our word, and we would rather you did not.</p>
<p>Our firmware is open source, so you can read the code that creates your seed yourself. Both devices also have a documented reproducible build process, so you can build a release from source and confirm it matches the binary we published. Passport Core’s is at <a href="https://github.com/Foundation-Devices/passport2/blob/main/REPRODUCIBILITY.md">REPRODUCIBILITY.md</a> and Passport Prime’s is in the <a href="https://github.com/Foundation-Devices/KeyOS">KeyOS repository</a>.</p>
<p>Independent security audits of both Passport Core and Passport Prime are published in full, along with our responses to them, at <a href="https://foundation.xyz/security/">foundation.xyz/security</a>.</p>
<h2><a name="p-3515-please-be-careful-of-scammers-4" class="anchor" href="#p-3515-please-be-careful-of-scammers-4" aria-label="Heading link"></a><strong>Please be careful of scammers</strong></h2>
<p>This is the part we would most like you to take away.</p>
<p>Scammers are always circling, but when something high profile happens they go into overdrive, because they know a lot of people are suddenly worried, confused and in a hurry. Assume anyone who contacts you out of the blue about your wallet is a scammer until proven otherwise.</p>
<p>To be completely clear about how we operate:</p>
<ul>
<li>
<p><strong>Foundation will never ask for your seed words, recovery phrase, private keys, passphrase or PIN.</strong> Not by email, not on the forum, not in a support ticket, not on a call. There is no situation in which we need them.</p>
</li>
<li>
<p>We will never ask you to type your recovery phrase into a website, a form, an app or a support tool.</p>
</li>
<li>
<p>We will never contact you unexpectedly about your wallet, and we will never ask you to move your funds.</p>
</li>
<li>
<p>We will never ask you to share your screen or install remote access software.</p>
</li>
</ul>
<p>If someone is pressuring you to act quickly, telling you your funds are at risk and they can help, offering a “recovery service”, or asking you to verify your seed somewhere, stop and do nothing. That is the scam.</p>
<p>Be especially wary of direct messages, of people claiming to be Foundation or Coinkite staff, and of search results and sponsored links for wallet software. Only download software from the official source, and take a moment to check the address you are typing.</p>
<p>If you do need to move funds because of this, there is no prize for speed over care. Take your time, verify addresses on your device screen, and if anything feels off, ask here in public rather than in a private message.</p>
<h2><a name="p-3515-questions-5" class="anchor" href="#p-3515-questions-5" aria-label="Heading link"></a><strong>Questions</strong></h2>
<p>If you have questions about how your Passport creates and protects your seed, ask below and we will answer them.</p>
